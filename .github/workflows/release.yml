name: Release
on:
  push:
    tags: ['v*.*.*']
permissions: {contents: write, packages: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - id: meta
        uses: docker/metadata-action@v5
        with: {images: ghcr.io/pro50347/hh-media-guard, tags: 'type=semver,pattern={{version}}\ntype=semver,pattern={{major}}.{{minor}}\ntype=semver,pattern={{major}}\ntype=raw,value=latest'}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: ${{ steps.meta.outputs.tags }}, labels: ${{ steps.meta.outputs.labels }}, platforms: linux/amd64}
      - uses: softprops/action-gh-release@v2
