services:
  media-guard:
    build: .
    image: ghcr.io/pro50347/hh-media-guard:latest
    container_name: hh-media-guard
    ports:
      - "3938:3938"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - APP_NAME=${APP_NAME:-H&H Media Guard}
      - SUITE_NAME=${SUITE_NAME:-H&H Suite}
      - APP_URL=${APP_URL:-http://localhost:3938}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set a 32-byte base64 encryption key}
      - ALLOW_DESTRUCTIVE_ACTIONS=false
      - MEDIA_ROOTS=/movies,/tv
    volumes:
      - ./config:/config
      - ${MOVIES_PATH:-./sample-media}:/movies:ro
      - ${TV_PATH:-./sample-media}:/tv:ro
    restart: unless-stopped
